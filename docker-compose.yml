x-app-environment: &app-environment
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eu_regulations
  OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
  HF_HOME: /home/app/.cache/huggingface

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: eu_regulations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eu_regulations"]
      interval: 5s
      timeout: 5s
      retries: 10

  indexer:
    image: eu-regulation-assistant:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - /bin/sh
      - -c
      - >-
        python -m scripts.initialize_database &&
        python -m scripts.build_semantic_index &&
        python -m scripts.load_semantic_index
    environment: *app-environment
    volumes:
      - model_cache:/home/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - setup

  api:
    image: eu-regulation-assistant:local
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/home/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5m

volumes:
  postgres_data:
  model_cache:
